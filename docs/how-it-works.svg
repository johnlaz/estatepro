<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="How EstatePro works: add key, enter property, read verdict, save to portfolio">
<rect width="1200" height="260" rx="22" fill="#0b1322"/><rect x="1" y="1" width="1198" height="258" rx="21" fill="none" stroke="#2e4166"/>
<text x="600" y="44" text-anchor="middle" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="800" fill="#e8eef7">How it works</text>
<rect x="30" y="70" width="255" height="150" rx="14" fill="#121d33" stroke="#2e4166"/><rect x="30" y="70" width="6" height="150" rx="3" fill="#e2b04a"/><text x="54" y="106" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#e8eef7">1  Add your key</text><text x="54" y="134" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Free Groq key from</text><text x="54" y="156" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">console.groq.com.</text><text x="54" y="178" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Stored in your browser.</text>
<path d="M285 145 H312" stroke="#e2b04a" stroke-width="3" fill="none"/><path d="M308 138 L320 145 L308 152 Z" fill="#e2b04a"/>
<rect x="320" y="70" width="255" height="150" rx="14" fill="#121d33" stroke="#2e4166"/><rect x="320" y="70" width="6" height="150" rx="3" fill="#4aa3e8"/><text x="344" y="106" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#e8eef7">2  Enter a property</text><text x="344" y="134" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Address or pasted</text><text x="344" y="156" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Zillow / Realtor text.</text><text x="344" y="178" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Add ask price for verdict.</text>
<path d="M575 145 H602" stroke="#e2b04a" stroke-width="3" fill="none"/><path d="M598 138 L610 145 L598 152 Z" fill="#e2b04a"/>
<rect x="610" y="70" width="255" height="150" rx="14" fill="#121d33" stroke="#2e4166"/><rect x="610" y="70" width="6" height="150" rx="3" fill="#e2b04a"/><text x="634" y="106" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#e8eef7">3  Read the verdict</text><text x="634" y="134" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Estimate, range, comps,</text><text x="634" y="156" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">strengths and concerns.</text>
<path d="M865 145 H892" stroke="#e2b04a" stroke-width="3" fill="none"/><path d="M888 138 L900 145 L888 152 Z" fill="#e2b04a"/>
<rect x="900" y="70" width="270" height="150" rx="14" fill="#121d33" stroke="#2e4166"/><rect x="900" y="70" width="6" height="150" rx="3" fill="#4aa3e8"/><text x="924" y="106" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="700" fill="#e8eef7">4  Save and track</text><text x="924" y="134" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">Portfolio, expenses,</text><text x="924" y="156" font-family="Inter,system-ui,-apple-system,'Segoe UI',sans-serif" font-size="15" fill="#9db0c9">deal pipeline, reports.</text>
</svg>